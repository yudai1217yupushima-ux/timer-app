<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <input type="text" value="Timer">
    
    <div id="timeSelect">
  <p>作業時間を選択</p>

  <div class="timeOption">
    <button id="time25">25分</button>
    <p>休憩5分</p>
  </div>

  <div class="timeOption">
    <button id="time50">50分</button>
    <p>休憩10分</p>
  </div>
    <p>セット数を選択</p>

<div class="setOption">
  <button id="set1">1</button>
  <button id="set2">2</button>
  <button id="set3">3</button>
  <button id="set4">4</button>
  <button id="set5">5</button>
  <button id="set6">6</button>
  <button id="set7">7</button>
  <button id="set8">8</button>
  <button id="set9">9</button>
</div>
</div>


    <div id="mode">作業中</div>

    <div id="timer">00:00</div>

    <button id="start">スタート</button>
    <button id="stop">ストップ</button>
    <button id="reset">リセット</button>
    <div id="popup">
   <div id="popupMessage">作業時間終了！</div>
   <button id="rest">休憩する</button>
   <button id="finish">終了</button>
   </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
